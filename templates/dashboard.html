<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - MovieMagic</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<!-- UPDATED BODY TAG -->
<body data-theme="{{ session.get('user', {}).get('theme', 'dark') }}">
    <div class="navbar">
        <div class="logo">MOVIEMAGIC</div>
        
        <div class="user-menu">
            <a href="{{ url_for('profile') }}" style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                <div style="width: 35px; height: 35px; background: #e50914; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold;">
                    {{ session['user']['name'][0] | upper }}
                </div>
                <span style="color: var(--text-white);">Hi, {{ session['user']['name'] }}</span>
            </a>
        </div>
    </div>

    <div class="container fade-in">
        <h2 class="section-title">Now Showing</h2>
        <div class="movie-grid">
            {% for movie in movies %}
            <a href="{{ url_for('movie_details', movie_id=movie.movie_id) }}" class="movie-card" style="text-decoration: none; color: inherit; display: block;">
                <img
                    src="{{ url_for('static', filename='images/mad.jpg') }}"
                    data-image="{{ movie.image }}"
                    data-fallback="{{ url_for('static', filename='images/mad.jpg') }}"
                    alt="{{ movie.title }}"
                    class="movie-poster movie-poster-dynamic"
                >
                
                <div class="movie-info">
                    <div class="movie-title">{{ movie.title }}</div>
                    <div class="movie-genre">{{ movie.genre }}</div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="color: var(--primary); font-weight: bold; font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 110px;" title="{{ movie.language }}">
                            {{ movie.language }}
                        </span>
                        <span class="btn-outline" style="padding: 6px 12px; font-size: 0.75rem; white-space: nowrap;">View Info</span>
                    </div>
                </div>
            </a>
            {% endfor %}
        </div>
    </div>

    <script>
        function extractGoogleDriveId(url) {
            if (!url) return null;

            const filePathMatch = url.match(/\/file\/d\/([^/]+)/);
            if (filePathMatch && filePathMatch[1]) return filePathMatch[1];

            const idQueryMatch = url.match(/[?&]id=([^&]+)/);
            if (idQueryMatch && idQueryMatch[1]) return idQueryMatch[1];

            return null;
        }

        function buildImageCandidates(rawUrl) {
            if (!rawUrl) return [];

            let url = String(rawUrl).trim();
            if (!url) return [];

            if (url.startsWith('www.')) {
                url = 'https://' + url;
            } else if (url.startsWith('//')) {
                url = 'https:' + url;
            }

            const candidates = [];
            const add = (u) => {
                if (u && !candidates.includes(u)) candidates.push(u);
            };

            // If admin typed a local file name like mad.jpg
            if (!url.startsWith('http') && !url.includes('/')) {
                add("{{ url_for('static', filename='images/') }}" + url);
                return candidates;
            }

            add(url);

            if (url.includes('drive.google.com') || url.includes('drive.usercontent.google.com')) {
                const fileId = extractGoogleDriveId(url);
                if (fileId) {
                    // Try multiple Google endpoints because one may timeout intermittently.
                    add('https://drive.google.com/uc?export=view&id=' + fileId);
                    add('https://drive.usercontent.google.com/download?id=' + fileId + '&export=view&authuser=0');
                    add('https://drive.google.com/thumbnail?id=' + fileId + '&sz=w1000');
                }
            }

            return candidates;
        }

        function loadWithCandidates(img, candidates, index) {
            if (!candidates.length || index >= candidates.length) {
                img.onerror = null;
                img.src = img.dataset.fallback;
                return;
            }

            img.onerror = function () {
                loadWithCandidates(img, candidates, index + 1);
            };
            img.src = candidates[index];
        }

        document.querySelectorAll('.movie-poster-dynamic').forEach((img) => {
            const raw = img.dataset.image || '';
            const candidates = buildImageCandidates(raw);
            loadWithCandidates(img, candidates, 0);
        });
    </script>
</body>
</html>
